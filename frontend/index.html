<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / Theme -->
  <meta name="theme-color" content="#0D1B3E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gully Predict" />

  <!-- SEO / Description -->
  <title>Gully Predict — IPL Fantasy Predictions</title>
  <meta name="description"
    content="Predict IPL match outcomes, earn points, and compete with friends on global and league leaderboards. The ultimate cricket prediction platform." />
  <meta name="keywords" content="IPL, cricket, prediction, fantasy, leaderboard, T20" />

  <!-- Open Graph -->
  <meta property="og:title" content="Gully Predict" />
  <meta property="og:description" content="Predict IPL matches and compete with friends." />
  <meta property="og:image" content="/pwa-512x512.png" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Gully Predict" />
  <meta name="twitter:description" content="Predict IPL matches and compete with friends." />
  <meta name="twitter:image" content="/pwa-512x512.png" />
</head>

<body>
  <div id="root">
    <div style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #161B2E 0%, #0B0E1A 100%);
      color: #ffffff;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    ">
      <!-- Pulsing Logo Container -->
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: startup-pulse 2s infinite ease-in-out;
      ">
        <!-- Gold Trophy SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F4C430"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="
          filter: drop-shadow(0 0 15px rgba(244, 196, 48, 0.45));
        ">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
          <path d="M4 22h16"></path>
          <path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"></path>
          <path d="M12 2a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6Z"></path>
        </svg>

        <!-- Premium Title -->
        <div style="
          font-size: 24px;
          font-weight: 800;
          letter-spacing: 0.15em;
          color: #ffffff;
          text-transform: uppercase;
          text-align: center;
          margin-top: 8px;
        ">
          Gully Predict
        </div>

        <!-- Subtle Subtitle -->
        <div style="
          font-size: 9px;
          font-weight: 500;
          letter-spacing: 0.25em;
          color: rgba(255, 255, 255, 0.4);
          text-transform: uppercase;
          text-align: center;
          margin-top: -6px;
        ">
          Gully to Glory!
        </div>
      </div>

      <!-- Pulse Style definition -->
      <style>
        @keyframes startup-pulse {

          0%,
          100% {
            transform: scale(1);
            opacity: 0.85;
          }

          50% {
            transform: scale(1.05);
            opacity: 1;
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
